<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TNO Report Submission Status — Sabah Mission</title>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy-950: #030712;
            --navy-900: #0a0f1e;
            --navy-800: #0d1526;
            --navy-700: #111d33;
            --navy-600: #162242;
            --navy-500: #1e3058;
            --glass-bg: rgba(255,255,255,0.04);
            --glass-bg-hover: rgba(255,255,255,0.07);
            --glass-border: rgba(255,255,255,0.08);
            --glass-border-hover: rgba(255,255,255,0.16);
            --glass-strong: rgba(255,255,255,0.10);
            --accent-blue: #3b82f6;
            --accent-blue-soft: rgba(59,130,246,0.15);
            --accent-blue-glow: rgba(59,130,246,0.25);
            --accent-emerald: #10b981;
            --accent-emerald-soft: rgba(16,185,129,0.15);
            --accent-rose: #f43f5e;
            --accent-rose-soft: rgba(244,63,94,0.15);
            --accent-amber: #f59e0b;
            --accent-amber-soft: rgba(245,158,11,0.15);
            --accent-violet: #8b5cf6;
            --accent-violet-soft: rgba(139,92,246,0.15);
            --text-primary: rgba(255,255,255,0.95);
            --text-secondary: rgba(255,255,255,0.55);
            --text-muted: rgba(255,255,255,0.30);
            --font-display: 'Syne', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 20px;
            --radius-2xl: 24px;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background-color: var(--navy-900);
            background-image:
                radial-gradient(ellipse 80% 50% at 20% 0%, rgba(59,130,246,0.12) 0%, transparent 60%),
                radial-gradient(ellipse 60% 40% at 80% 100%, rgba(139,92,246,0.08) 0%, transparent 50%),
                radial-gradient(ellipse 40% 30% at 50% 50%, rgba(16,185,129,0.04) 0%, transparent 60%);
            min-height: 100vh;
            color: var(--text-primary);
        }

        /* ── HEADER ── */
        .header {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            background: rgba(10,15,30,0.85);
            border-bottom: 1px solid var(--glass-border);
            padding: 0 2rem;
        }
        .header-inner {
            max-width: 1400px;
            margin: 0 auto;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-logo {
            width: 36px;
            height: 36px;
            border-radius: var(--radius-sm);
            background: var(--accent-blue-soft);
            border: 1px solid rgba(59,130,246,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-display);
            font-weight: 800;
            font-size: 14px;
            color: var(--accent-blue);
            letter-spacing: -0.5px;
            flex-shrink: 0;
        }
        .header-title {
            font-family: var(--font-display);
            font-size: 15px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
            line-height: 1.2;
        }
        .header-sub {
            font-size: 10px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sync-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 99px;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-emerald);
            box-shadow: 0 0 0 2px var(--accent-emerald-soft);
            animation: syncPulse 2.5s ease-in-out infinite;
        }
        @keyframes syncPulse {
            0%, 100% { opacity: 1; box-shadow: 0 0 0 2px var(--accent-emerald-soft); }
            50% { opacity: 0.6; box-shadow: 0 0 0 4px rgba(16,185,129,0.05); }
        }
        .lang-toggle {
            display: flex;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            overflow: hidden;
        }
        .lang-btn {
            padding: 5px 12px;
            font-size: 11px;
            font-weight: 600;
            font-family: var(--font-display);
            color: var(--text-muted);
            background: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 0.05em;
        }
        .lang-btn.active {
            background: var(--accent-blue);
            color: #fff;
        }
        .print-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            font-size: 12px;
            font-weight: 600;
            font-family: var(--font-display);
            color: var(--text-secondary);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
        }
        .print-btn:hover { background: var(--glass-bg-hover); color: var(--text-primary); border-color: var(--glass-border-hover); }

        /* ── LAYOUT ── */
        .page-wrap {
            max-width: 1400px;
            margin: 0 auto;
            padding: 2rem;
            display: flex;
            gap: 1.5rem;
            align-items: flex-start;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: 220px;
            flex-shrink: 0;
            position: sticky;
            top: 80px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .sidebar-section {
            padding: 16px;
        }
        .sidebar-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-family: var(--font-display);
        }
        .year-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }
        .year-btn {
            padding: 6px 4px;
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-display);
            color: var(--text-muted);
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .year-btn:hover { color: var(--text-secondary); background: var(--glass-bg); }
        .year-btn.active {
            color: var(--accent-blue);
            background: var(--accent-blue-soft);
            border-color: rgba(59,130,246,0.3);
        }
        .month-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }
        .month-btn {
            padding: 6px 4px;
            font-size: 10px;
            font-weight: 600;
            font-family: var(--font-display);
            color: var(--text-muted);
            background: transparent;
            border: 1px solid transparent;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            letter-spacing: 0.02em;
        }
        .month-btn:hover { color: var(--text-secondary); background: var(--glass-bg); }
        .month-btn.active {
            color: #fff;
            background: var(--accent-blue);
            border-color: transparent;
        }
        .fullyear-btn {
            grid-column: span 3;
            margin-top: 4px;
            padding: 7px;
            font-size: 10px;
            font-weight: 600;
            font-family: var(--font-display);
            color: var(--text-secondary);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            letter-spacing: 0.05em;
        }
        .fullyear-btn:hover { background: var(--glass-bg-hover); color: var(--text-primary); }
        .fullyear-btn.active {
            color: var(--accent-violet);
            background: var(--accent-violet-soft);
            border-color: rgba(139,92,246,0.3);
        }
        .sidebar-divider { border: none; border-top: 1px solid var(--glass-border); margin: 0; }
        .mobile-select {
            display: none;
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 13px;
            border-radius: var(--radius-md);
            padding: 10px 12px;
            outline: none;
        }

        /* ── MAIN CONTENT ── */
        .main-content {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* ── SEARCH ── */
        .search-wrap {
            position: relative;
        }
        .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            width: 16px;
            height: 16px;
            pointer-events: none;
        }
        .search-input {
            width: 100%;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-size: 13px;
            padding: 11px 14px 11px 40px;
            outline: none;
            transition: all 0.2s;
        }
        .search-input::placeholder { color: var(--text-muted); }
        .search-input:focus { border-color: rgba(59,130,246,0.4); background: var(--glass-bg-hover); box-shadow: 0 0 0 3px var(--accent-blue-glow); }

        /* ── EXEC SUMMARY ── */
        .exec-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .section-heading {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--text-muted);
        }
        .live-badge {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 600;
            color: var(--accent-emerald);
            background: var(--accent-emerald-soft);
            border: 1px solid rgba(16,185,129,0.25);
            padding: 3px 10px;
            border-radius: 99px;
        }
        .exec-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .exec-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            position: relative;
            overflow: hidden;
            transition: all 0.25s;
        }
        .exec-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            border-radius: 2px 2px 0 0;
        }
        .exec-card.blue::before { background: linear-gradient(90deg, var(--accent-blue), transparent); }
        .exec-card.rose::before { background: linear-gradient(90deg, var(--accent-rose), transparent); }
        .exec-card.emerald::before { background: linear-gradient(90deg, var(--accent-emerald), transparent); }
        .exec-card.amber::before { background: linear-gradient(90deg, var(--accent-amber), transparent); }
        .exec-card-icon {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            margin-bottom: 2px;
        }
        .exec-card.blue .exec-card-icon { background: var(--accent-blue-soft); }
        .exec-card.rose .exec-card-icon { background: var(--accent-rose-soft); }
        .exec-card.emerald .exec-card-icon { background: var(--accent-emerald-soft); }
        .exec-card.amber .exec-card-icon { background: var(--accent-amber-soft); }
        .exec-card-label {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
            font-family: var(--font-display);
        }
        .exec-card-value {
            font-family: var(--font-display);
            font-size: 28px;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -1px;
        }
        .exec-card.blue .exec-card-value { color: var(--accent-blue); }
        .exec-card.rose .exec-card-value { color: var(--accent-rose); }
        .exec-card.emerald .exec-card-value { color: var(--accent-emerald); }
        .exec-card.amber .exec-card-value { color: var(--accent-amber); }
        .exec-card-sub {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .exec-insight {
            display: flex;
            align-items: flex-start;
            gap: 6px;
            margin-top: 4px;
            padding: 7px 9px;
            border-radius: var(--radius-sm);
            font-size: 10px;
            font-weight: 500;
            line-height: 1.5;
            color: var(--text-secondary);
        }
        .exec-card.blue .exec-insight { background: var(--accent-blue-soft); color: rgba(147,197,253,0.9); }
        .exec-card.rose .exec-insight { background: var(--accent-rose-soft); color: rgba(253,164,175,0.9); }
        .exec-card.emerald .exec-insight { background: var(--accent-emerald-soft); color: rgba(110,231,183,0.9); }
        .exec-card.amber .exec-insight { background: var(--accent-amber-soft); color: rgba(252,211,77,0.9); }
        .insight-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; margin-top: 4px; }
        .exec-card.blue .insight-dot { background: var(--accent-blue); }
        .exec-card.rose .insight-dot { background: var(--accent-rose); }
        .exec-card.emerald .insight-dot { background: var(--accent-emerald); }
        .exec-card.amber .insight-dot { background: var(--accent-amber); }
        .exec-skeleton { height: 120px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-lg); animation: shimmer 1.8s ease-in-out infinite; }
        @keyframes shimmer { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        /* ── WILAYAH SECTION ── */
        .wilayah-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }
        .wilayah-heading {
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-secondary);
        }
        .global-pct-badge {
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font-display);
            color: var(--accent-blue);
            background: var(--accent-blue-soft);
            border: 1px solid rgba(59,130,246,0.25);
            padding: 4px 12px;
            border-radius: 99px;
        }
        .wilayah-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
        }
        .w-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            position: relative;
            transition: all 0.25s;
            text-align: center;
        }
        .w-card:hover { background: var(--glass-bg-hover); border-color: var(--glass-border-hover); transform: translateY(-2px); }
        .w-card.active { border-color: rgba(59,130,246,0.5); background: var(--accent-blue-soft); box-shadow: 0 0 20px var(--accent-blue-glow); }
        .w-card.complete { border-color: rgba(16,185,129,0.4); background: var(--accent-emerald-soft); }
        .w-card.complete:hover { box-shadow: 0 0 20px rgba(16,185,129,0.2); }
        .w-name {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .w-badge {
            position: absolute;
            top: -7px; right: -7px;
            background: var(--accent-rose);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            font-family: var(--font-display);
            min-width: 20px;
            height: 20px;
            padding: 0 5px;
            border-radius: 99px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--navy-900);
            box-shadow: 0 0 8px rgba(244,63,94,0.5);
        }
        .ring-wrap { position: relative; width: 60px; height: 60px; }
        .ring-wrap svg { transform: rotate(-90deg); }
        .ring-center {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--font-display);
            font-size: 13px;
            font-weight: 700;
            color: var(--text-primary);
        }
        .w-sub { font-size: 10px; color: var(--text-muted); font-weight: 500; }
        .w-allin {
            font-size: 9px;
            font-weight: 700;
            font-family: var(--font-display);
            color: var(--accent-emerald);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        /* ── COMPARISON BARS ── */
        .comp-grid { display: flex; flex-direction: column; gap: 10px; }
        .comp-row { display: flex; align-items: center; gap: 12px; }
        .comp-label { font-size: 11px; font-weight: 600; font-family: var(--font-display); color: var(--text-secondary); width: 68px; text-align: right; flex-shrink: 0; }
        .comp-track { flex: 1; height: 8px; background: rgba(244,63,94,0.15); border-radius: 99px; overflow: hidden; }
        .comp-fill { height: 100%; border-radius: 99px; background: var(--accent-emerald); transition: width 0.8s cubic-bezier(0.16,1,0.3,1); }
        .comp-fill.full { background: var(--accent-emerald); box-shadow: 0 0 8px rgba(16,185,129,0.5); }
        .comp-pct { font-size: 11px; font-weight: 700; font-family: var(--font-display); color: var(--text-secondary); width: 34px; flex-shrink: 0; }

        /* ── LOADER ── */
        .loader-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 60px 0;
        }
        .spinner {
            width: 28px;
            height: 28px;
            border: 2px solid var(--glass-border);
            border-top-color: var(--accent-blue);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loader-text { font-size: 12px; color: var(--text-muted); font-weight: 500; }

        /* ── SEARCH RESULTS ── */
        .search-results-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .search-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .search-title { font-family: var(--font-display); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent-blue); }
        .clear-btn { font-size: 11px; font-weight: 600; color: var(--text-muted); background: none; border: none; cursor: pointer; transition: color 0.2s; }
        .clear-btn:hover { color: var(--text-primary); }

        /* ── CHURCH CARD ── */
        .church-card {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 12px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            transition: all 0.2s;
        }
        .church-card:hover { border-color: var(--glass-border-hover); }
        .church-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .church-name { font-size: 13px; font-weight: 600; color: var(--text-primary); line-height: 1.3; }
        .church-tags { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 4px; }
        .tag {
            display: inline-flex;
            align-items: center;
            font-size: 9px;
            font-weight: 600;
            font-family: var(--font-display);
            padding: 2px 7px;
            border-radius: 4px;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }
        .tag-wilayah { background: rgba(59,130,246,0.15); color: rgba(147,197,253,0.9); }
        .tag-daerah { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); }
        .tag-type { background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-muted); }
        .tag-pic { background: var(--accent-violet-soft); color: rgba(196,181,253,0.9); }
        .tag-audit-done { background: var(--accent-emerald-soft); color: rgba(110,231,183,0.9); }
        .tag-audit-pending { background: var(--accent-amber-soft); color: rgba(252,211,77,0.9); }
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            font-weight: 700;
            font-family: var(--font-display);
            padding: 4px 10px;
            border-radius: 99px;
            flex-shrink: 0;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .status-submitted { background: var(--accent-emerald-soft); color: var(--accent-emerald); border: 1px solid rgba(16,185,129,0.25); }
        .status-pending { background: var(--accent-rose-soft); color: var(--accent-rose); border: 1px solid rgba(244,63,94,0.25); }
        .status-dot { width: 5px; height: 5px; border-radius: 50%; }
        .status-submitted .status-dot { background: var(--accent-emerald); }
        .status-pending .status-dot { background: var(--accent-rose); }

        /* full year grid in church card */
        .month-status-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; border-top: 1px solid var(--glass-border); padding-top: 8px; }
        .month-cell { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 2px; border-radius: 5px; }
        .month-cell.sub { background: var(--accent-emerald-soft); }
        .month-cell.pend { background: var(--accent-rose-soft); }
        .month-cell-lbl { font-size: 7.5px; font-weight: 700; font-family: var(--font-display); letter-spacing: 0.05em; text-transform: uppercase; }
        .month-cell.sub .month-cell-lbl { color: var(--accent-emerald); }
        .month-cell.pend .month-cell-lbl { color: var(--accent-rose); }
        .month-cell-icon { font-size: 10px; line-height: 1.2; }

        /* ── DEEP DIVE MODAL ── */
        .modal-overlay {
            position: fixed; inset: 0;
            z-index: 200;
            background: rgba(3,7,18,0.75);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .modal-overlay.open { display: flex; }
        .modal-overlay.visible { opacity: 1; }
        .modal-box {
            background: var(--navy-800);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-2xl);
            width: 100%;
            max-width: 900px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateY(16px) scale(0.98);
            transition: transform 0.3s cubic-bezier(0.16,1,0.3,1);
            box-shadow: 0 40px 100px rgba(0,0,0,0.6);
        }
        .modal-overlay.visible .modal-box { transform: translateY(0) scale(1); }
        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 20px;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .modal-title {
            font-family: var(--font-display);
            font-size: 14px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.3px;
        }
        .modal-close {
            width: 30px; height: 30px;
            display: flex; align-items: center; justify-content: center;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            cursor: pointer;
            color: var(--text-secondary);
            font-size: 16px;
            transition: all 0.2s;
        }
        .modal-close:hover { background: var(--glass-bg-hover); color: var(--text-primary); }
        .modal-body {
            overflow-y: auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            flex: 1;
        }
        .modal-body::-webkit-scrollbar { width: 4px; }
        .modal-body::-webkit-scrollbar-track { background: transparent; }
        .modal-body::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 99px; }
        .daerah-block {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
        }
        .daerah-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background: var(--glass-bg);
            border-bottom: 1px solid var(--glass-border);
        }
        .daerah-name {
            font-family: var(--font-display);
            font-size: 11px;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }
        .daerah-pct {
            font-size: 11px;
            font-weight: 700;
            font-family: var(--font-display);
            padding: 2px 8px;
            border-radius: 99px;
        }
        .daerah-pct.full { background: var(--accent-emerald-soft); color: var(--accent-emerald); }
        .daerah-pct.partial { background: var(--glass-bg); color: var(--text-muted); }
        .daerah-list { padding: 8px; display: flex; flex-direction: column; gap: 5px; }

        /* ── FOOTER ── */
        .footer {
            text-align: center;

        .footer-ts { font-size: 11px; color: var(--text-muted); font-weight: 600; }

        /* ── RESPONSIVE ── */
        @media (max-width: 1100px) {
            .wilayah-grid { grid-template-columns: repeat(4, 1fr); }
            .exec-grid { grid-template-columns: repeat(3, 1fr); }
        }
        @media (max-width: 860px) {
            .page-wrap { flex-direction: column; padding: 1rem; }
            .sidebar { width: 100%; position: static; }
            .month-grid-desktop { display: none; }
            .mobile-select { display: block; }
            .wilayah-grid { grid-template-columns: repeat(3, 1fr); }
            .exec-grid { grid-template-columns: repeat(1, 1fr); }

        @media (max-width: 540px) {
            .wilayah-grid { grid-template-columns: repeat(2, 1fr); }
            .header { padding: 0 1rem; }
            .header-title { font-size: 13px; }
            .sync-badge { display: none; }

        /* ── PRINT ── */
        @media print {
            body { background: white !important; color: black !important; }
            .header, .sidebar, .search-wrap, .footer { display: none !important; }
            .page-wrap { padding: 0; }
            .glass-panel, .exec-card, .w-card, .church-card { background: white !important; border: 1px solid #e2e8f0 !important; }
            .exec-card-value, .exec-card-label, .exec-card-sub, .w-name, .ring-center, .church-name { color: black !important; }

        .hidden { display: none !important; }

<script>
    const SPREADSHEET_BASE_ID = '1x3GOISJ6VrvytCil-l_INYRK0HU_s_vf6U1Y2Lpzd8A';
    const months = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
    const viewOptions = [...months, 'FULL YEAR'];

    let currentYear = '';
    let currentMonth = '';
    let rawSheetData = [];
    let selectedWilayah = null;
    let currentLanguage = 'en';
    let summaryMetrics = null;

    const actualCalendarYear = new Date().getFullYear().toString();
    const actualPreviousYear = (new Date().getFullYear() - 1).toString();
    const actualCurrentMonth = months[new Date().getMonth()];

    const dict = {
        en: {
            title: 'TNO Report Submission Status',
            subtitle: 'SABAH MISSION — FINANCE DEPARTMENT',
            liveSync: 'Live · 5 min cache',
            selYear: 'Year',
            selView: 'Month',
            searchPlaceholder: 'Search church / daerah...',
            searchResults: 'Search Results',
            clearSearch: 'Clear ✕',
            dashTitle: 'Wilayah Dashboard',
            compTitle: 'Submission Comparison',
            compSub: 'Wilayah vs. Wilayah',
            deepTitle: 'Deep-Dive Status',
            printBtn: 'Print',
            fetching: 'Fetching live data…',
            status_as_of: 'Status as of:',
            pending: 'Pending',
            submitted: 'Submitted',
            received: 'Received',
            all_in: 'All In',
            full_year: 'Full Year',
            full_year_lbl: 'Full Year Overview',
            annual_view: 'Annual View',
            annual_audit: 'Annual Audit View',
            summaryTitle: 'Executive Summary',
        },
        bm: {
            title: 'Status Penyerahan Laporan TNO',
            subtitle: 'MISSION SABAH — JABATAN KEWANGAN',
            liveSync: 'Langsung · 5 min cache',
            selYear: 'Tahun',
            selView: 'Bulan',
            searchPlaceholder: 'Cari gereja / daerah...',
            searchResults: 'Hasil Carian',
            clearSearch: 'Padam ✕',
            dashTitle: 'Papan Pemuka Wilayah',
            compTitle: 'Perbandingan Penyerahan',
            compSub: 'Wilayah vs. Wilayah',
            deepTitle: 'Status Terperinci',
            printBtn: 'Cetak',
            fetching: 'Mengambil data langsung…',
            status_as_of: 'Status setakat:',
            pending: 'Tertunggak',
            submitted: 'Dihantar',
            received: 'Diterima',
            all_in: 'Selesai',
            full_year: 'Sepanjang Tahun',
            full_year_lbl: 'Gambaran Tahunan',
            annual_view: 'Paparan Tahunan',
            annual_audit: 'Paparan Audit Tahunan',
            summaryTitle: 'Ringkasan Eksekutif',
        }
    };

    function getText(key) { return dict[currentLanguage][key] || key; }

    function changeLang(lang) {
        currentLanguage = lang;
        document.getElementById('lang-en').className = 'lang-btn' + (lang === 'en' ? ' active' : '');
        document.getElementById('lang-bm').className = 'lang-btn' + (lang === 'bm' ? ' active' : '');
        document.querySelectorAll('[data-lang]').forEach(el => {
            const k = el.getAttribute('data-lang');
            if (dict[currentLanguage][k]) el.innerText = dict[currentLanguage][k];
        });
        document.querySelectorAll('[data-placeholder]').forEach(el => {
            const k = el.getAttribute('data-placeholder');
            if (dict[currentLanguage][k]) el.placeholder = dict[currentLanguage][k];
        });
        updateTimestamp();
        renderMonthSelectors();
        renderSummaryCards();
        if (rawSheetData.length > 0) { calculateAndRenderUI(); handleSearch(); }
    }

    function updateTimestamp() {
        const now = new Date();
        const ts = `${getText('status_as_of')} ${now.toLocaleString()}`;
        document.getElementById('live-timestamp-footer').innerText = ts;
    }

    function handleModalClick(e) { if (e.target === e.currentTarget) closeDeepDiveModal(); }

    function initApp() {
        currentYear = actualCalendarYear;
        if (!['2023','2024','2025','2026'].includes(currentYear)) currentYear = '2026';
        currentMonth = actualCurrentMonth;
        document.getElementById('footer-year').innerText = new Date().getFullYear();
        updateTimestamp();
        updateYearSelectorsUI();
        renderMonthSelectors();
        loadSheetFeed();
        loadSummaryStats();
    }

    function renderMonthSelectors() {
        const track = document.getElementById('month-track');
        const dropdown = document.getElementById('month-dropdown');
        track.innerHTML = '';
        dropdown.innerHTML = '';

        months.forEach(m => {
            const isActive = m === currentMonth;
            const btn = document.createElement('button');
            btn.className = 'month-btn' + (isActive ? ' active' : '');
            btn.innerText = m.slice(0,3);
            btn.onclick = () => changeMonth(m);
            track.appendChild(btn);

            const opt = document.createElement('option');
            opt.value = m;
            opt.innerText = `${m} ${currentYear}`;
            if (isActive) opt.selected = true;
            dropdown.appendChild(opt);
        });

        const fyBtn = document.createElement('button');
        fyBtn.className = 'fullyear-btn' + (currentMonth === 'FULL YEAR' ? ' active' : '');
        fyBtn.innerText = getText('full_year');
        fyBtn.onclick = () => changeMonth('FULL YEAR');
        track.appendChild(fyBtn);

        const fyOpt = document.createElement('option');
        fyOpt.value = 'FULL YEAR';
        fyOpt.innerText = getText('full_year_lbl');
        if (currentMonth === 'FULL YEAR') fyOpt.selected = true;
        dropdown.appendChild(fyOpt);
    }

    function parseCsvToArray(text) {
        const lines = text.split('\n');
        if (lines.length < 2) return [];
        const data = [];
        for (let i = 1; i < lines.length; i++) {
            if (!lines[i].trim()) continue;
            const columns = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c => c.replace(/^"|"$/g,'').trim());
            if (columns.length < 5 || !columns[0]) continue;
            const rowObj = {
                wilayah: columns[0],
                daerah: columns[1],
                gereja: columns[2],
                type: columns[3],
                prPic: columns[4] || '-',
                audit: columns[5] || '-',
                months: {}
            };
            months.forEach((m, idx) => {
                const s = columns[6 + idx] ? columns[6 + idx].toLowerCase() : '';
                rowObj.months[m] = s.includes('submit') ? 'Submitted' : 'Pending';
            });
            data.push(rowObj);
        }
        return data;
    }

    async function loadSummaryStats() {
        try {
            const [prevRes, currRes] = await Promise.all([
                fetch(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_BASE_ID}/gviz/tq?tqx=out:csv&sheet=${actualPreviousYear}`),
                fetch(`https://docs.google.com/spreadsheets/d/${SPREADSHEET_BASE_ID}/gviz/tq?tqx=out:csv&sheet=${actualCalendarYear}`)
            ]);

            const prevData = parseCsvToArray(await prevRes.text());
            const currData = parseCsvToArray(await currRes.text());

            // Metric 1: Compliance velocity — how many months-worth of reports are still pending from last year
            let prevTotal = 0, prevPending = 0;
            prevData.forEach(c => { months.forEach(m => { prevTotal++; if (c.months[m] !== 'Submitted') prevPending++; }); });
            const prevYearPendingPercent = prevTotal > 0 ? Math.round((prevPending / prevTotal) * 100) : 0;
            const prevYearPendingCount = prevPending;

            // Metric 2: Current month submission rate + churches at risk
            let currTotal = 0, currSubmitted = 0, currPending = 0;
            currData.forEach(c => {
                currTotal++;
                if (c.months[actualCurrentMonth] === 'Submitted') currSubmitted++; else currPending++;
            });
            const currMonthRate = currTotal > 0 ? Math.round((currSubmitted / currTotal) * 100) : 0;

            // Metric 3: Chronic non-submitters — churches pending 3+ consecutive months this year
            const monthsToNow = months.slice(0, months.indexOf(actualCurrentMonth) + 1);
            let chronicCount = 0;
            let chronicNames = [];
            if (monthsToNow.length >= 3) {
                currData.forEach(c => {
                    const recentThree = monthsToNow.slice(-3);
                    const allPending = recentThree.every(m => c.months[m] !== 'Submitted');
                    if (allPending) { chronicCount++; chronicNames.push(c.gereja); }
                });
            }

            // Metric 4: Best and worst wilayah this month
            const wStats = {};
            currData.forEach(c => {
                if (!wStats[c.wilayah]) wStats[c.wilayah] = { t: 0, s: 0 };
                wStats[c.wilayah].t++;
                if (c.months[actualCurrentMonth] === 'Submitted') wStats[c.wilayah].s++;
            });
            let bestW = '-', bestP = -1, worstW = '-', worstP = 101;
            Object.keys(wStats).forEach(w => {
                const p = Math.round((wStats[w].s / wStats[w].t) * 100);
                if (p > bestP) { bestP = p; bestW = w; }
                if (p < worstP) { worstP = p; worstW = w; }
            });

            // Audit completion rate
            let auditDone = 0, auditTotal = 0;
            currData.forEach(c => {
                if (c.audit && c.audit !== '-') {
                    auditTotal++;
                    if (c.audit.toLowerCase().includes('done')) auditDone++;
                }
            });
            const auditRate = auditTotal > 0 ? Math.round((auditDone / auditTotal) * 100) : null;

            summaryMetrics = {
                prevYearPendingPercent, prevYearPendingCount,
                currMonthRate, currPending,
                chronicCount,
                bestW, bestP, worstW, worstP,
                auditRate, auditDone, auditTotal,
                currTotal
            };
            renderSummaryCards();
        } catch (err) {
            console.error('Summary stats error:', err);
            document.getElementById('summary-cards-container').innerHTML = `<p style="font-size:12px;color:var(--accent-rose);font-weight:600;">Analysis unavailable</p>`;
        }
    }

    function renderSummaryCards() {
        if (!summaryMetrics) return;
        const { prevYearPendingPercent, prevYearPendingCount, currMonthRate, currPending, chronicCount, bestW, bestP, worstW, worstP, auditRate, auditDone, auditTotal, currTotal } = summaryMetrics;

        // Card 1: Current month compliance
        const riskLevel = currMonthRate >= 80 ? 'On track' : currMonthRate >= 50 ? 'Needs attention' : 'Critical';
        const card1Color = currMonthRate >= 80 ? 'emerald' : currMonthRate >= 50 ? 'amber' : 'rose';
        const card1Icon = currMonthRate >= 80 ? '✓' : currMonthRate >= 50 ? '!' : '✗';
        const card1Insight = currPending > 0
            ? `${currPending} of ${currTotal} churches have not submitted for ${actualCurrentMonth} ${actualCalendarYear}.`
            : `All churches submitted for ${actualCurrentMonth}.`;

        // Card 2: Chronic risk (3+ months pending)
        const chronicColor = chronicCount === 0 ? 'emerald' : chronicCount <= 3 ? 'amber' : 'rose';
        const chronicInsight = chronicCount === 0
            ? `No churches are chronically behind for the past 3 months.`
            : `${chronicCount} church${chronicCount > 1 ? 'es are' : ' is'} pending for 3+ consecutive months — escalation recommended.`;

        // Card 3: Year-over-year backlog or audit health
        let card3Html = '';
        if (auditRate !== null) {
            const auditColor = auditRate >= 80 ? 'blue' : auditRate >= 50 ? 'amber' : 'rose';
            const auditInsight = auditRate === 100
                ? `All ${auditTotal} tracked churches have been audited for ${actualCalendarYear}.`
                : `${auditTotal - auditDone} church${auditTotal - auditDone !== 1 ? 'es' : ''} still pending audit completion.`;
            card3Html = buildExecCard('blue', '📋', 'Audit Completion', `${auditRate}%`, `${auditDone}/${auditTotal} churches audited`, auditInsight);
        } else {
            const prevColor = prevYearPendingPercent === 0 ? 'emerald' : prevYearPendingPercent <= 15 ? 'amber' : 'rose';
            const prevInsight = prevYearPendingPercent === 0
                ? `All ${actualPreviousYear} reports are fully settled. Excellent compliance.`
                : `${prevYearPendingCount} report${prevYearPendingCount !== 1 ? 's' : ''} from ${actualPreviousYear} remain unresolved. Follow-up required.`;
            card3Html = buildExecCard(prevColor, '📁', `${actualPreviousYear} Backlog`, `${prevYearPendingPercent}%`, `Of annual total still pending`, prevInsight);
        }

        document.getElementById('summary-cards-container').innerHTML =
            buildExecCard(card1Color, card1Icon, `Submission Rate (${actualCurrentMonth})`, `${currMonthRate}%`, riskLevel, card1Insight) +
            buildExecCard(chronicColor, '⚠', 'Chronic Non-Submitters', `${chronicCount}`, `Churches · 3+ months pending`, chronicInsight) +
            card3Html;
    }

    function buildExecCard(color, icon, label, value, sub, insight) {
        return `
        <div class="exec-card ${color}">
            <div class="exec-card-icon">${icon}</div>
            <div class="exec-card-label">${label}</div>
            <div class="exec-card-value">${value}</div>
            <div class="exec-card-sub">${sub}</div>
            <div class="exec-insight"><span class="insight-dot"></span><span>${insight}</span></div>
        </div>`;
    }

    async function loadSheetFeed() {
        showLoader(true);
        const url = `https://docs.google.com/spreadsheets/d/${SPREADSHEET_BASE_ID}/gviz/tq?tqx=out:csv&sheet=${currentYear}`;
        try {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Network error');
            rawSheetData = parseCsvToArray(await res.text());
            updateTimestamp();
            calculateAndRenderUI();
        } catch (err) {
            document.getElementById('loader').innerHTML = `<p style="font-size:12px;color:var(--accent-rose);font-weight:600;">Failed to sync data feed.</p>`;
        }
    }

    function calculateAndRenderUI() {
        showLoader(false);
        const viewText = currentMonth === 'FULL YEAR' ? getText('annual_view') : currentMonth;
        document.getElementById('dashboard-title').innerText = `${getText('dashTitle')} · ${viewText} ${currentYear}`;

        const wilayahMap = {};
        let totalChurches = 0, totalSubmitted = 0;

        rawSheetData.forEach(item => {
            const w = item.wilayah;
            if (!w) return;
            if (!wilayahMap[w]) wilayahMap[w] = { total: 0, submitted: 0, data: [] };
            if (currentMonth === 'FULL YEAR') {
                wilayahMap[w].total += 12; totalChurches += 12;
                months.forEach(m => { if (item.months[m] === 'Submitted') { wilayahMap[w].submitted++; totalSubmitted++; } });
            } else {
                wilayahMap[w].total++; totalChurches++;
                if ((item.months[currentMonth] || 'Pending') === 'Submitted') { wilayahMap[w].submitted++; totalSubmitted++; }
            }
            wilayahMap[w].data.push(item);
        });

        const globalPct = totalChurches > 0 ? Math.round((totalSubmitted / totalChurches) * 100) : 0;
        document.getElementById('global-percentage').innerText = `${globalPct}% submitted`;

        const grid = document.getElementById('wilayah-grid');
        const bars = document.getElementById('comparison-bars-container');
        grid.innerHTML = ''; bars.innerHTML = '';
        document.getElementById('comparison-graph-section').classList.remove('hidden');

        Object.keys(wilayahMap).sort((a,b) => a.localeCompare(b, undefined, {numeric:true})).forEach(w => {
            const stats = wilayahMap[w];
            const pct = stats.total > 0 ? Math.round((stats.submitted / stats.total) * 100) : 0;
            const pending = stats.total - stats.submitted;
            const isComplete = pct === 100;

            const card = document.createElement('div');
            card.className = `w-card${isComplete ? ' complete' : ''}${selectedWilayah === w ? ' active' : ''}`;

            const ringTrackColor = isComplete ? 'rgba(16,185,129,0.2)' : 'rgba(244,63,94,0.2)';
            const ringFillColor = isComplete ? '#10b981' : '#3b82f6';

            card.innerHTML = `
                ${pending > 0 ? `<span class="w-badge">${pending}</span>` : ''}
                <span class="w-name">W${w}</span>
                <div class="ring-wrap">
                    <svg width="60" height="60" viewBox="0 0 36 36">
                        <path stroke="${ringTrackColor}" stroke-width="3" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                        <path stroke="${ringFillColor}" stroke-width="3" stroke-linecap="round" stroke-dasharray="${pct},100" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
                    </svg>
                    <div class="ring-center" style="${isComplete ? 'color:var(--accent-emerald)' : ''}">${pct}%</div>
                </div>
                <div>
                    <div class="w-sub">${stats.submitted}/${stats.total}</div>
                    ${isComplete ? `<div class="w-allin">${getText('all_in')}</div>` : ''}
                </div>
            `;
            card.onclick = () => { selectedWilayah = w; calculateAndRenderUI(); renderDeepDive(w, stats); openDeepDiveModal(); };
            grid.appendChild(card);

            const barRow = document.createElement('div');
            barRow.className = 'comp-row';
            barRow.innerHTML = `
                <span class="comp-label">Wilayah ${w}</span>
                <div class="comp-track">
                    <div class="comp-fill${isComplete ? ' full' : ''}" style="width:${pct}%"></div>
                </div>
                <span class="comp-pct">${pct}%</span>
            `;
            bars.appendChild(barRow);
        });
    }

    function buildChurchCardHtml(c, showLocation = false) {
        const isSub = (c.months[currentMonth] || 'Pending') === 'Submitted';

        const locationTags = showLocation ? `
            <span class="tag tag-wilayah">W${c.wilayah}</span>
            <span class="tag tag-daerah">${c.daerah}</span>
        ` : '';
        const prTag = c.prPic && c.prPic !== '-' ? `<span class="tag tag-pic">👤 ${c.prPic}</span>` : '';
        const auditLower = c.audit ? c.audit.toLowerCase() : '';
        const auditTag = c.audit && c.audit !== '-'
            ? `<span class="tag ${auditLower.includes('done') ? 'tag-audit-done' : 'tag-audit-pending'}">📋 ${c.audit}</span>`
            : '';

        let statusBlock = '';
        if (currentMonth === 'FULL YEAR') {
            let cellsHtml = '';
            months.forEach(m => {
                const s = c.months[m] === 'Submitted';
                cellsHtml += `<div class="month-cell ${s ? 'sub' : 'pend'}">
                    <span class="month-cell-lbl">${m.slice(0,1)}</span>
                    <span class="month-cell-icon">${s ? '✓' : '✗'}</span>
                </div>`;
            });
            statusBlock = `<div class="month-status-grid">${cellsHtml}</div>`;
        } else {
            statusBlock = `<span class="status-pill ${isSub ? 'status-submitted' : 'status-pending'}">
                <span class="status-dot"></span>${isSub ? getText('submitted') : getText('pending')}
            </span>`;
        }

        return `
        <div class="church-card-top">
            <div style="min-width:0;">
                <div class="church-name">${c.gereja}</div>
                <div class="church-tags">
                    ${locationTags}
                    <span class="tag tag-type">${c.type}</span>
                    ${prTag}
                    ${auditTag}
                </div>
            </div>
            ${currentMonth !== 'FULL YEAR' ? statusBlock : ''}
        </div>
        ${currentMonth === 'FULL YEAR' ? statusBlock : ''}`;
    }

    function handleSearch() {
        const query = document.getElementById('search-input').value.toLowerCase();
        const stdDash = document.getElementById('standard-dashboard');
        const srcSec = document.getElementById('search-results-section');
        const container = document.getElementById('search-results-container');

        if (!query) { stdDash.classList.remove('hidden'); srcSec.classList.add('hidden'); return; }
        stdDash.classList.add('hidden'); srcSec.classList.remove('hidden'); container.innerHTML = '';

        const results = rawSheetData.filter(c =>
            c.gereja.toLowerCase().includes(query) ||
            c.daerah.toLowerCase().includes(query) ||
            c.wilayah.toLowerCase().includes(query) ||
            c.prPic.toLowerCase().includes(query)
        );

        if (results.length === 0) {
            container.innerHTML = `<div style="grid-column:span 2;text-align:center;padding:2rem;color:var(--text-muted);font-size:13px;">No churches found for "${query}"</div>`;
            return;
        }
        results.forEach(c => {
            const card = document.createElement('div');
            card.className = 'church-card';
            card.innerHTML = buildChurchCardHtml(c, true);
            container.appendChild(card);
        });
    }

    function clearSearch() { document.getElementById('search-input').value = ''; handleSearch(); }

    function renderDeepDive(wilayahName, stats) {
        const container = document.getElementById('church-cards-container');
        const viewText = currentMonth === 'FULL YEAR' ? getText('annual_view') : currentMonth;
        document.getElementById('deep-dive-title').innerText = `Wilayah ${wilayahName} · ${viewText} ${currentYear}`;
        container.innerHTML = '';

        const daerahGroup = {};
        stats.data.forEach(c => {
            if (!daerahGroup[c.daerah]) daerahGroup[c.daerah] = [];
            daerahGroup[c.daerah].push(c);
        });

        Object.keys(daerahGroup).sort().forEach(dName => {
            const list = daerahGroup[dName];
            list.sort((a,b) => {
                if (currentMonth === 'FULL YEAR') {
                    const pA = months.filter(m => a.months[m] !== 'Submitted').length;
                    const pB = months.filter(m => b.months[m] !== 'Submitted').length;
                    if (pA > 0 && pB === 0) return -1;
                    if (pA === 0 && pB > 0) return 1;
                    return a.gereja.localeCompare(b.gereja);
                } else {
                    const sA = a.months[currentMonth] === 'Submitted' ? 1 : 0;
                    const sB = b.months[currentMonth] === 'Submitted' ? 1 : 0;
                    return sA !== sB ? sA - sB : a.gereja.localeCompare(b.gereja);
                }
            });

            let done = 0, total = 0;
            if (currentMonth === 'FULL YEAR') {
                list.forEach(c => { total += 12; months.forEach(m => { if (c.months[m] === 'Submitted') done++; }); });
            } else {
                total = list.length;
                done = list.filter(c => c.months[currentMonth] === 'Submitted').length;
            }
            const dPct = total > 0 ? Math.round((done / total) * 100) : 0;

            const block = document.createElement('div');
            block.className = 'daerah-block';
            const sanitized = dName.replace(/[^a-zA-Z0-9]/g,'-');
            block.innerHTML = `
                <div class="daerah-header">
                    <span class="daerah-name">${dName}</span>
                    <span class="daerah-pct ${dPct === 100 ? 'full' : 'partial'}">${dPct}%</span>
                </div>
                <div class="daerah-list" id="dlist-${sanitized}"></div>
            `;
            container.appendChild(block);

            const listEl = document.getElementById(`dlist-${sanitized}`);
            list.forEach(c => {
                const card = document.createElement('div');
                card.className = 'church-card';
                const isSub = currentMonth !== 'FULL YEAR' && c.months[currentMonth] === 'Submitted';
                if (currentMonth !== 'FULL YEAR' && !isSub) card.style.opacity = '0.7';
                card.innerHTML = buildChurchCardHtml(c, false);
                listEl.appendChild(card);
            });
        });
    }

    function openDeepDiveModal() {
        const modal = document.getElementById('deep-dive-modal');
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';
        requestAnimationFrame(() => { requestAnimationFrame(() => { modal.classList.add('visible'); }); });
    }

    function closeDeepDiveModal() {
        const modal = document.getElementById('deep-dive-modal');
        modal.classList.remove('visible');
        setTimeout(() => { modal.classList.remove('open'); selectedWilayah = null; calculateAndRenderUI(); }, 300);
        document.body.style.overflow = '';
    }

    function changeYear(y) {
        if (currentYear === y) return;
        currentYear = y;
        updateYearSelectorsUI();
        renderMonthSelectors();
        loadSheetFeed();
    }

    function updateYearSelectorsUI() {
        document.querySelectorAll('#year-selector button').forEach(b => b.className = 'year-btn');
        const btn = document.getElementById(`btn-${currentYear}`);
        if (btn) btn.className = 'year-btn active';
    }

    function changeMonth(m) {
        if (currentMonth === m) return;
        currentMonth = m;
        renderMonthSelectors();
        if (rawSheetData.length > 0) { closeDeepDiveModal(); calculateAndRenderUI(); handleSearch(); }
    }

    function showLoader(show) {
        const loader = document.getElementById('loader');
        const grid = document.getElementById('wilayah-grid');
        const comp = document.getElementById('comparison-graph-section');
        if (show) {
            closeDeepDiveModal();
            loader.classList.remove('hidden');
            grid.classList.add('hidden');
            comp.classList.add('hidden');
        } else {
            loader.classList.add('hidden');
            grid.classList.remove('hidden');
        }
    }

    window.onload = initApp;
</script>
</body>
</html>
